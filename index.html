<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wir Kerkower</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- Admin Modal -->
    <div id="admin-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 relative">
            <h3 class="text-lg font-bold text-slate-800 mb-2"><i class="fa-solid fa-lock text-emerald-600 mr-2"></i>Admin-Bereich entsperren</h3>
            <p class="text-sm text-slate-500 mb-4">Bitte geben Sie das Admin-Passwort ein (Standard: <code class="bg-slate-100 px-1.5 py-0.5 rounded font-mono text-xs">dorf2026</code>).</p>
            <input type="password" id="admin-password-input" placeholder="Passwort..." class="w-full text-sm p-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none mb-4">
            <div class="flex justify-end space-x-2">
                <button onclick="closeAdminModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium rounded-xl transition">Abbrechen</button>
                <button onclick="verifyAdminPassword()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium rounded-xl transition">Anmelden</button>
            </div>
        </div>
    </div>

    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-emerald-600 text-white p-2.5 rounded-2xl shadow-md">
                    <i class="fa-solid fa-house-chimney text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900 tracking-tight">Dorf-App <span class="text-xs bg-emerald-100 text-emerald-800 px-2.5 py-0.5 rounded-full font-semibold ml-2">Gemeinschaft</span></h1>
                    <p class="text-xs text-slate-500">Projekt: dorfapp-2c48f</p>
                </div>
            </div>

            <!-- Status & User Controls -->
            <div class="flex items-center flex-wrap gap-2 justify-end">
                <div id="firebase-status-badge" class="flex items-center bg-emerald-50 border border-emerald-200 px-3 py-1.5 rounded-xl text-xs font-medium text-emerald-800 transition-all shadow-sm cursor-pointer" onclick="showFirebaseInfo()">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 mr-2" id="firebase-dot"></span>
                    <span id="firebase-status-text">Online & Verbunden</span>
                </div>

                <button id="admin-btn" onclick="handleAdminClick()" class="flex items-center space-x-1.5 px-3.5 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-medium transition shadow-sm">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span id="admin-btn-text">Admin</span>
                </button>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="bg-slate-50 border-t border-slate-200">
            <div class="max-w-7xl mx-auto px-4 flex overflow-x-auto space-x-2 py-2 scrollbar-none">
                <button onclick="switchTab('checkin')" class="tab-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center space-x-2 bg-emerald-600 text-white shadow-sm" data-tab="checkin">
                    <i class="fa-solid fa-clipboard-check"></i><span>Checkprogramm</span>
                </button>
                <button onclick="switchTab('pinwand')" class="tab-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center space-x-2 bg-white text-slate-600 hover:bg-slate-200/60" data-tab="pinwand">
                    <i class="fa-solid fa-signs-post"></i><span>Pinwand</span>
                </button>
                <button onclick="switchTab('schwarzesbrett')" class="tab-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center space-x-2 bg-white text-slate-600 hover:bg-slate-200/60" data-tab="schwarzesbrett">
                    <i class="fa-solid fa-note-sticky"></i><span>Schwarzes Brett</span>
                </button>
                <button onclick="switchTab('hinwand')" class="tab-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center space-x-2 bg-white text-slate-600 hover:bg-slate-200/60" data-tab="hinwand">
                    <i class="fa-solid fa-bullhorn text-amber-600"></i><span>Hinwand</span>
                </button>
                <button onclick="switchTab('chat')" class="tab-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center space-x-2 bg-white text-slate-600 hover:bg-slate-200/60" data-tab="chat">
                    <i class="fa-solid fa-comments"></i><span>Dorf-Chat</span>
                </button>
                <button onclick="switchTab('kalender')" class="tab-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center space-x-2 bg-white text-slate-600 hover:bg-slate-200/60" data-tab="kalender">
                    <i class="fa-solid fa-calendar-days"></i><span>Terminkalender</span>
                </button>
                <button id="admin-tab-btn" onclick="switchTab('admin')" class="tab-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center space-x-2 bg-white text-slate-600 hover:bg-slate-200/60 hidden" data-tab="admin">
                    <i class="fa-solid fa-gears text-amber-500"></i><span>Adminbereich</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
        <div id="tab-content" class="w-full"></div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400">
        Dorf-App &bull; Projekt: dorfapp-2c48f &bull; Live-Modus
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBW3EyegmGhtzzCmY3CxwP8UR8wJWPsCs4",
            authDomain: "dorfapp-2c48f.firebaseapp.com",
            projectId: "dorfapp-2c48f",
            storageBucket: "dorfapp-2c48f.firebasestorage.app",
            messagingSenderId: "447527926701",
            appId: "1:447527926701:web:180ad7e2312bd96a4d7f24"
        };

        const appId = 'dorf-app-default';
        let db = null;

        window.appData = {
            checkins: [
                { id: 'sample1', nickname: 'Maria', status: 'Im Garten aktiv', location: 'Dorfplatz', timestamp: Date.now() - 3600000 }
            ],
            pinwand: [
                { id: 'p1', category: 'Verschenke', title: 'Gut erhaltenes Kinderfahrrad', description: 'Abzuholen in der Hauptstr. 12.', nickname: 'Maria', timestamp: Date.now() - 7200000 }
            ],
            schwarzesbrett: [
                { id: 'sb1', title: 'Fundstück: Schlüsselbund', description: 'Am Dorfteich gefunden.', nickname: 'Gemeindebüro', timestamp: Date.now() - 10000000 }
            ],
            hinwand: [
                { id: 'h1', title: 'Willkommen in der Dorf-App!', description: 'Hier finden Sie alle offiziellen Infos.', timestamp: Date.now() - 86400000 }
            ],
            chat: [
                { id: 'c1', nickname: 'Hans', message: 'Hallo zusammen!', timestamp: Date.now() - 5000000 }
            ],
            visitors: 42
        };

        window.currentTab = 'checkin';
        window.userNickname = localStorage.getItem('dorf_nickname') || '';
        window.isAdmin = localStorage.getItem('dorf_is_admin') === 'true';

        window.showFirebaseInfo = function() {
            alert("Firebase Status: Verbunden mit Projekt dorfapp-2c48f (Firestore Aktiv).");
        }

        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if(!container) return;
            const toast = document.createElement('div');
            toast.className = `p-4 rounded-xl shadow-lg text-sm font-medium text-white transition transform translate-y-2 opacity-0 pointer-events-auto flex items-center space-x-2 ${type === 'error' ? 'bg-red-600' : 'bg-emerald-600'}`;
            toast.innerHTML = `<i class="fa-solid ${type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check'}"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 50);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        window.escapeHtml = function(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            setupListeners();
        } catch (e) {
            console.warn("Firestore Init Note:", e);
        }

        function setupListeners() {
            if(!db) return;
            const collections = ['checkins', 'pinwand', 'schwarzesbrett', 'hinwand', 'chat'];
            collections.forEach(colName => {
                try {
                    const colRef = collection(db, 'artifacts', appId, 'public', 'data', colName);
                    onSnapshot(colRef, (snapshot) => {
                        const items = [];
                        snapshot.forEach(d => {
                            items.push({ id: d.id, ...d.data() });
                        });
                        if (items.length > 0 || snapshot.size >= 0) {
                            window.appData[colName] = items;
                            renderApp();
                        }
                    }, (err) => {
                        console.warn("Snapshot sync note:", err);
                    });
                } catch(err) {
                    console.warn("Collection setup note:", err);
                }
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            updateAdminUI();
            renderApp();
        });

        window.switchTab = function(tabName) {
            if (tabName === 'admin' && !window.isAdmin) {
                document.getElementById('admin-modal').classList.remove('hidden');
                return;
            }
            window.currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.dataset.tab === tabName) {
                    btn.className = "tab-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center space-x-2 bg-emerald-600 text-white shadow-sm";
                } else {
                    btn.className = "tab-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center space-x-2 bg-white text-slate-600 hover:bg-slate-200/60";
                }
            });
            renderApp();
        }

        window.handleAdminClick = function() {
            if (window.isAdmin) {
                if (confirm("Möchtest du den Admin-Modus verlassen?")) {
                    window.isAdmin = false;
                    localStorage.setItem('dorf_is_admin', 'false');
                    updateAdminUI();
                    if(window.currentTab === 'admin') switchTab('checkin');
                    showToast("Admin-Modus beendet");
                }
            } else {
                document.getElementById('admin-modal').classList.remove('hidden');
            }
        }

        window.closeAdminModal = function() {
            document.getElementById('admin-modal').classList.add('hidden');
            document.getElementById('admin-password-input').value = '';
        }

        window.verifyAdminPassword = function() {
            const pwd = document.getElementById('admin-password-input').value;
            if (pwd === "dorf2026" || pwd === "admin") {
                window.isAdmin = true;
                localStorage.setItem('dorf_is_admin', 'true');
                closeAdminModal();
                updateAdminUI();
                showToast("Admin-Bereich erfolgreich entsperrt!");
                switchTab('admin');
            } else {
                showToast("Falsches Passwort!", "error");
            }
        }

        window.updateAdminUI = function() {
            const adminTabBtn = document.getElementById('admin-tab-btn');
            const adminBtnText = document.getElementById('admin-btn-text');
            if (window.isAdmin) {
                if(adminTabBtn) adminTabBtn.classList.remove('hidden');
                if(adminBtnText) adminBtnText.textContent = "Admin Aktiv";
            } else {
                if(adminTabBtn) adminTabBtn.classList.add('hidden');
                if(adminBtnText) adminBtnText.textContent = "Admin";
            }
        }

        window.deleteItem = async function(collectionName, id) {
            if (!window.isAdmin) {
                showToast("Nur Admins dürfen Einträge löschen!", "error");
                return;
            }
            if (!confirm("Möchtest du diesen Eintrag wirklich löschen?")) return;
            
            window.appData[collectionName] = window.appData[collectionName].filter(item => item.id !== id);
            renderApp();
            showToast("Eintrag erfolgreich gelöscht.");

            if (db) {
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', collectionName, id));
                } catch(e) {
                    console.warn("Cloud delete note:", e);
                }
            }
        }

        window.renderApp = function() {
            const container = document.getElementById('tab-content');
            if (!container) return;

            switch(window.currentTab) {
                case 'checkin': container.innerHTML = renderCheckinView(); break;
                case 'pinwand': container.innerHTML = renderPinwandView(); break;
                case 'schwarzesbrett': container.innerHTML = renderSchwarzesBrettView(); break;
                case 'hinwand': container.innerHTML = renderHinwandView(); break;
                case 'chat':
                    container.innerHTML = renderChatView();
                    setTimeout(() => {
                        const box = document.getElementById('chat-messages-box');
                        if(box) box.scrollTop = box.scrollHeight;
                    }, 50);
                    break;
                case 'kalender': container.innerHTML = renderKalenderView(); break;
                case 'admin': container.innerHTML = renderAdminView(); break;
                default: container.innerHTML = renderCheckinView();
            }
        }

        function renderCheckinView() {
            const list = window.appData.checkins || [];
            return `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h2 class="text-lg font-bold text-slate-800 mb-2"><i class="fa-solid fa-clipboard-check text-emerald-600 mr-2"></i>Dorf-Checkin</h2>
                        <p class="text-xs text-slate-500 mb-6">Trage dich mit Namen ein, damit die Dorfgemeinschaft weiß, wer anwesend ist.</p>
                        <form onsubmit="submitCheckin(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Ihr Name / Nickname</label>
                                <input type="text" id="checkin-nickname" placeholder="z.B. Anna Müller..." value="${escapeHtml(window.userNickname)}" required class="w-full text-sm p-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-slate-50">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Status / Aktivität</label>
                                <input type="text" id="checkin-status" placeholder="z.B. Im Garten..." required class="w-full text-sm p-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-slate-50">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Ort im Dorf</label>
                                <input type="text" id="checkin-location" placeholder="z.B. Dorfplatz..." class="w-full text-sm p-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-slate-50">
                            </div>
                            <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-semibold transition shadow-sm">
                                <i class="fa-solid fa-check mr-2"></i>Einchecken
                            </button>
                        </form>
                    </div>
                    <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h2 class="text-lg font-bold text-slate-800 mb-4"><i class="fa-solid fa-users text-emerald-600 mr-2"></i>Aktive Bewohner (${list.length})</h2>
                        <div class="space-y-3 max-h-[500px] overflow-y-auto pr-2">
                            ${list.length === 0 ? '<p class="text-slate-400 text-sm italic py-8 text-center">Aktuell hat sich niemand eingecheckt.</p>' :
                                list.map(item => `
                                    <div class="p-4 rounded-xl border border-slate-100 bg-slate-50 flex justify-between items-center">
                                        <div>
                                            <div class="flex items-center space-x-2">
                                                <span class="font-bold text-sm text-slate-800">${escapeHtml(item.nickname)}</span>
                                                <span class="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-medium">${escapeHtml(item.status)}</span>
                                            </div>
                                            <p class="text-xs text-slate-500 mt-1"><i class="fa-solid fa-location-dot mr-1 text-slate-400"></i>${escapeHtml(item.location || 'Kein Ort')} &bull; ${new Date(item.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</p>
                                        </div>
                                        ${window.isAdmin ? `<button onclick="deleteItem('checkins', '${item.id}')" class="text-red-500 hover:text-red-700 text-xs px-2.5 py-1 rounded-lg bg-red-50 font-medium">Löschen</button>` : ''}
                                    </div>
                                `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        window.submitCheckin = async function(e) {
            e.preventDefault();
            const nicknameInput = document.getElementById('checkin-nickname').value.trim();
            const status = document.getElementById('checkin-status').value.trim();
            const location = document.getElementById('checkin-location').value.trim();
            if (!nicknameInput || !status) return;

            window.userNickname = nicknameInput;
            localStorage.setItem('dorf_nickname', nicknameInput);

            const newItem = { id: 'chk_' + Date.now(), nickname: nicknameInput, status, location, timestamp: Date.now() };
            window.appData.checkins.unshift(newItem);
            document.getElementById('checkin-status').value = '';
            document.getElementById('checkin-location').value = '';
            renderApp();
            showToast("Erfolgreich eingecheckt!");

            if (db) {
                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'checkins'), {
                        nickname: newItem.nickname, status: newItem.status, location: newItem.location, timestamp: newItem.timestamp
                    });
                } catch(e) { console.warn(e); }
            }
        }

        function renderPinwandView() {
            const list = window.appData.pinwand || [];
            return `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h2 class="text-lg font-bold text-slate-800 mb-2"><i class="fa-solid fa-signs-post text-emerald-600 mr-2"></i>Pin-wand</h2>
                        <p class="text-xs text-slate-500 mb-6">Biete etwas an oder verschenke Gegenstände.</p>
                        <form onsubmit="submitPinwand(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Ihr Name</label>
                                <input type="text" id="pin-nickname" placeholder="Ihr Name..." value="${escapeHtml(window.userNickname)}" required class="w-full text-sm p-3 rounded-xl border border-slate-300 bg-slate-50">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Kategorie</label>
                                <select id="pin-category" class="w-full text-sm p-3 rounded-xl border border-slate-300 bg-slate-50">
                                    <option value="Biete">Biete</option><option value="Suche">Suche</option><option value="Verschenke">Verschenke</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Titel</label>
                                <input type="text" id="pin-title" placeholder="z.B. Rasenmäher..." required class="w-full text-sm p-3 rounded-xl border border-slate-300 bg-slate-50">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Beschreibung</label>
                                <textarea id="pin-desc" rows="3" placeholder="Details..." required class="w-full text-sm p-3 rounded-xl border border-slate-300 bg-slate-50"></textarea>
                            </div>
                            <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-semibold transition shadow-sm">
                                <i class="fa-solid fa-paper-plane mr-2"></i>Veröffentlichen
                            </button>
                        </form>
                    </div>
                    <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h2 class="text-lg font-bold text-slate-800 mb-4"><i class="fa-solid fa-bullhorn text-emerald-600 mr-2"></i>Inserate</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-h-[500px] overflow-y-auto pr-2">
                            ${list.length === 0 ? '<p class="text-slate-400 text-sm italic py-8 text-center col-span-2">Keine Anzeigen.</p>' :
                                list.map(item => `
                                    <div class="p-4 rounded-xl border border-slate-200 bg-slate-50 flex flex-col justify-between">
                                        <div>
                                            <span class="text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800">${escapeHtml(item.category)}</span>
                                            <h3 class="font-bold text-sm text-slate-800 mt-2 mb-1">${escapeHtml(item.title)}</h3>
                                            <p class="text-xs text-slate-600 mb-3">${escapeHtml(item.description)}</p>
                                        </div>
                                        <div class="flex justify-between items-center pt-2 border-t border-slate-200 text-[11px] text-slate-500">
                                            <span>Von: <strong>${escapeHtml(item.nickname)}</strong></span>
                                            ${window.isAdmin ? `<button onclick="deleteItem('pinwand', '${item.id}')" class="text-red-500 hover:text-red-700 font-medium">Löschen</button>` : ''}
                                        </div>
                                    </div>
                                `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        window.submitPinwand = async function(e) {
            e.preventDefault();
            const nickname = document.getElementById('pin-nickname').value.trim();
            const category = document.getElementById('pin-category').value;
            const title = document.getElementById('pin-title').value.trim();
            const description = document.getElementById('pin-desc').value.trim();
            if (!nickname || !title || !description) return;

            window.userNickname = nickname;
            localStorage.setItem('dorf_nickname', nickname);

            const newItem = { id: 'pin_' + Date.now(), category, title, description, nickname, timestamp: Date.now() };
            window.appData.pinwand.unshift(newItem);
            document.getElementById('pin-title').value = '';
            document.getElementById('pin-desc').value = '';
            renderApp();
            showToast("Anzeige veröffentlicht!");

            if (db) {
                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'pinwand'), { category, title, description, nickname, timestamp: newItem.timestamp });
                } catch(e) { console.warn(e); }
            }
        }

        function renderSchwarzesBrettView() {
            const list = window.appData.schwarzesbrett || [];
            return `

        window.submitChatMessage = async function(e) {
            e.preventDefault();
            const nicknameInput = document.getElementById('chat-nickname').value.trim();

            const message = input.value.trim();

            window.userNickname = nicknameInput;
            localStorage.setItem('dorf_nickname', nicknameInput);

            const newItem = { id: 'chat_' + Date.now(), nickname: nicknameInput, message, timestamp: Date.now() };
            window.appData.chat.push(newItem);
            input.value = '';
            renderApp();
            setTimeout(() => {
                const box = document.getElementById('chat-messages-box');
                if (box) box.scrollTop = box.scrollHeight;
            }, 100);

            if (db) {
