
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Die Kerkower</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <div id="admin-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 relative">
            <h3 class="text-lg font-bold text-slate-800 mb-2"><i class="fa-solid fa-lock text-emerald-600 mr-2"></i>Admin-Bereich entsperren</h3>
            <p class="text-sm text-slate-500 mb-4">Bitte geben Sie das Admin-Passwort ein (Standard: <code class="bg-slate-100 px-1.5 py-0.5 rounded font-mono text-xs">dorf2026</code>).</p>
            <input type="password" id="admin-password-input" placeholder="Passwort..." class="w-full text-sm p-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none mb-4">
            <div class="flex justify-end space-x-2">
                <button type="button" onclick="closeAdminModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium rounded-xl transition cursor-pointer">Abbrechen</button>
                <button type="button" onclick="verifyAdminPassword()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium rounded-xl transition cursor-pointer">Anmelden</button>
            </div>
        </div>
    </div>

    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-emerald-600 text-white p-2.5 rounded-2xl shadow-md">
                    <i class="fa-solid fa-house-chimney text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900 tracking-tight">Die Kerkower <span class="text-xs bg-emerald-100 text-emerald-800 px-2.5 py-0.5 rounded-full font-semibold ml-2">Gemeinschaft</span></h1>
                    <p class="text-xs text-slate-500"></p>
                </div>
            </div>

            <!-- Status & User Controls -->
            <div class="flex items-center flex-wrap gap-2 justify-end">
                <div id="firebase-status-badge" class="flex items-center bg-emerald-50 border border-emerald-200 px-3 py-1.5 rounded-xl text-xs font-medium text-emerald-800 transition-all shadow-sm cursor-pointer" onclick="showFirebaseInfo()">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 mr-2" id="firebase-dot"></span>
                    <span id="firebase-status-text">Online & Verbunden</span>
                </div>

                <button type="button" id="admin-btn" onclick="handleAdminClick()" class="flex items-center space-x-1.5 px-3.5 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-medium transition shadow-sm cursor-pointer">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span id="admin-btn-text">Admin</span>
                </button>
            </div>
        </div>

        <div class="bg-slate-50 border-t border-slate-200">
            <div class="max-w-7xl mx-auto px-4 flex overflow-x-auto space-x-2 py-2 scrollbar-none">
                <button type="button" onclick="switchTab('checkin')" class="tab-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center space-x-2 bg-emerald-600 text-white shadow-sm cursor-pointer" data-tab="checkin">
                    <i class="fa-solid fa-clipboard-check"></i><span>Check In</span>
                </button>
                <button type="button" onclick="switchTab('hinwand')" class="tab-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center space-x-2 bg-white text-slate-600 hover:bg-slate-200/60 cursor-pointer" data-tab="hinwand">
                    <i class="fa-solid fa-bullhorn text-amber-600"></i><span>Offizielle Bekanntmachungen</span>
                </button>
                <button type="button" onclick="switchTab('pinwand')" class="tab-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center space-x-2 bg-white text-slate-600 hover:bg-slate-200/60 cursor-pointer" data-tab="pinwand">
                    <i class="fa-solid fa-store"></i><span>Marktplatz</span>
                </button>
                <button type="button" onclick="switchTab('schwarzesbrett')" class="tab-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center space-x-2 bg-white text-slate-600 hover:bg-slate-200/60 cursor-pointer" data-tab="schwarzesbrett">
                    <i class="fa-solid fa-note-sticky"></i><span>Schwarzes Brett</span>
                </button>
                <button type="button" onclick="switchTab('chat')" class="tab-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center space-x-2 bg-white text-slate-600 hover:bg-slate-200/60 cursor-pointer" data-tab="chat">
                    <i class="fa-solid fa-comments"></i><span>Dorf-Chat</span>
                </button>
                <button type="button" onclick="switchTab('kalender')" class="tab-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center space-x-2 bg-white text-slate-600 hover:bg-slate-200/60 cursor-pointer" data-tab="kalender">
                    <i class="fa-solid fa-calendar-days"></i><span>Terminkalender</span>
                </button>
                <button type="button" onclick="switchTab('pushsettings')" class="tab-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center space-x-2 bg-white text-slate-600 hover:bg-slate-200/60 cursor-pointer" data-tab="pushsettings">
                    <i class="fa-solid fa-bell"></i><span>Push-Einstellungen</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
        <div id="tab-content" class="w-full"></div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400">
        Stefan E. &bull; wirkerkower@gmail.com &bull; 017626747126
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBW3EyegmGhtzzCmY3CxwP8UR8wJWPsCs4",
            authDomain: "dorfapp-2c48f.firebaseapp.com",
            projectId: "dorfapp-2c48f",
            storageBucket: "dorfapp-2c48f.firebasestorage.app",
            messagingSenderId: "447527926701",
            appId: "1:447527926701:web:180ad7e2312bd96a4d7f24"
        };

        const appId = 'dorf-app-default';
        let db = null;

        window.appData = {
            checkins: [
                { id: 'sample1', nickname: 'Maria', status: 'Im Garten aktiv', location: 'Dorfplatz', timestamp: Date.now() - 3600000 }
            ],
            pinwand: [
                { id: 'p1', category: 'Verschenke', title: 'Gut erhaltenes Kinderfahrrad', description: 'Abzuholen in der Hauptstr. 12.', nickname: 'Maria', timestamp: Date.now() - 7200000 }
            ],
            schwarzesbrett: [
                { id: 'sb1', title: 'Fundstück: Schlüsselbund', description: 'Am Dorfteich gefunden.', nickname: 'Gemeindebüro', timestamp: Date.now() - 10000000 }
            ],
            hinwand: [
                { id: 'h1', title: 'Willkommen in Kerkow!', description: 'Hier finden Sie alle offiziellen Infos.', pdfName: '', pdfData: '', timestamp: Date.now() - 86400000 }
            ],
            chat: [
                { id: 'c1', nickname: 'Hans', message: 'Hallo zusammen!', timestamp: Date.now() - 5000000 }
            ],
            kalender: [
                { id: 'k1', title: 'Dorffest Vorbereitung', date: new Date().toISOString().split('T')[0], time: '18:00', location: 'Dorfgemeinschaftshaus', description: 'Besprechung für das Sommerfest.', nickname: 'Ortsvorsteher', timestamp: Date.now() - 20000000 }
            ]
        };

        window.currentTab = 'checkin';
        window.userNickname = localStorage.getItem('dorf_nickname') || '';
        window.isCheckedIn = Boolean(window.userNickname);
        window.isAdmin = localStorage.getItem('dorf_is_admin') === 'true';
        window.marketFilter = 'Alle';

        window.logAppUsage = function() {
            let usageLogs = JSON.parse(localStorage.getItem('dorf_usage_logs') || '[]');
            const now = Date.now();
            usageLogs.push(now);
            const cutoff = now - (90 * 24 * 60 * 60 * 1000);
            usageLogs = usageLogs.filter(t => t > cutoff);
            localStorage.setItem('dorf_usage_logs', JSON.stringify(usageLogs));
        }
        window.logAppUsage();

        window.getUsageStats = function() {
            const usageLogs = JSON.parse(localStorage.getItem('dorf_usage_logs') || '[]');
            const now = new Date();
            const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
            const weekStart = todayStart - (7 * 24 * 60 * 60 * 1000);
            const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();

            let dayCount = 0;
            let weekCount = 0;
            let monthCount = 0;

            usageLogs.forEach(t => {
                if (t >= todayStart) dayCount++;
                if (t >= weekStart) weekCount++;
                if (t >= monthStart) monthCount++;
            });

            return { day: dayCount, week: weekCount, month: monthCount };
        }

        window.notificationSettings = JSON.parse(localStorage.getItem('dorf_notification_settings') || JSON.stringify({
            checkin: true,
            hinwand: true,
            pinwand: true,
            schwarzesbrett: true,
            chat: true,
            kalender: false
        }));

        window.saveNotificationSettings = function() {
            window.notificationSettings = {
                checkin: document.getElementById('notif-checkin').checked,
                hinwand: document.getElementById('notif-hinwand').checked,
                pinwand: document.getElementById('notif-pinwand').checked,
                schwarzesbrett: document.getElementById('notif-schwarzesbrett').checked,
                chat: document.getElementById('notif-chat').checked,
                kalender: document.getElementById('notif-kalender').checked
            };
            localStorage.setItem('dorf_notification_settings', JSON.stringify(window.notificationSettings));
            showToast("Benachrichtigungseinstellungen gespeichert!");
        }

        window.showFirebaseInfo = function() {
            showToast("Firebase Status: Verbunden mit Projekt dorfapp-2c48f (Firestore Aktiv).");
        }

        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if(!container) return;
            const toast = document.createElement('div');
            toast.className = `p-4 rounded-xl shadow-lg text-sm font-medium text-white transition transform translate-y-2 opacity-0 pointer-events-auto flex items-center space-x-2 ${type === 'error' ? 'bg-red-600' : 'bg-emerald-600'}`;
            toast.innerHTML = `<i class="fa-solid ${type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check'}"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 50);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        };

        window.escapeHtml = function(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            setupListeners();
        } catch (e) {
            console.warn("Firestore Init Note:", e);
        }

        function setupListeners() {
            if(!db) return;
            const collections = ['checkins', 'pinwand', 'schwarzesbrett', 'hinwand', 'chat', 'kalender'];
            collections.forEach(colName => {
                try {
                    const colRef = collection(db, 'artifacts', appId, 'public', 'data', colName);
                    onSnapshot(colRef, (snapshot) => {
                        const items = [];
                        snapshot.forEach(d => {
                            items.push({ id: d.id, ...d.data() });
                        });
                        
                        if (window.appData[colName] && items.length > window.appData[colName].length) {
                            if (window.notificationSettings && window.notificationSettings[colName]) {
                                showToast(`Neue Aktivität in ${getTabTitle(colName)}!`);
                            }
                        }

                        if (items.length > 0 || snapshot.size >= 0) {
                            window.appData[colName] = items;
                            renderApp();
                        }
                    }, (err) => {
                        console.warn("Snapshot sync note:", err);
                    });
                } catch(err) {
                    console.warn("Collection setup note:", err);
                }
            });
        }

        function getTabTitle(colName) {
            switch(colName) {
                case 'checkin': return 'Check In';
                case 'hinwand': return 'Offizielle Bekanntmachungen';
                case 'pinwand': return 'Marktplatz';
                case 'schwarzesbrett': return 'Schwarzes Brett';
                case 'chat': return 'Dorf-Chat';
                case 'kalender': return 'Terminkalender';
                default: return 'Dorf-App';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (window.userNickname) {
                window.isCheckedIn = true;
            }
            updateAdminUI();
            renderApp();
        });

        window.switchTab = function(tabName) {
            window.currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.dataset.tab === tabName) {
                    btn.className = "tab-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center space-x-2 bg-emerald-600 text-white shadow-sm cursor-pointer";
                } else {
                    btn.className = "tab-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center space-x-2 bg-white text-slate-600 hover:bg-slate-200/60 cursor-pointer";
                }
            });
            renderApp();
        }

        window.handleAdminClick = function() {
            if (window.isAdmin) {
                window.isAdmin = false;
                localStorage.setItem('dorf_is_admin', 'false');
                updateAdminUI();
                showToast("Admin-Modus beendet");
                renderApp();
            } else {
                document.getElementById('admin-modal').classList.remove('hidden');
            }
        }

        window.closeAdminModal = function() {
            document.getElementById('admin-modal').classList.add('hidden');
            document.getElementById('admin-password-input').value = '';
        }

        window.verifyAdminPassword = function() {
            const pwd = document.getElementById('admin-password-input').value;
            if (pwd === "dorf2026" || pwd === "admin") {
                window.isAdmin = true;
                localStorage.setItem('dorf_is_admin', 'true');
                closeAdminModal();
                updateAdminUI();
                showToast("Admin-Bereich erfolgreich entsperrt!");
                renderApp();
            } else {
                showToast("Falsches Passwort!", "error");
            }
        }

        window.updateAdminUI = function() {
            const adminBtnText = document.getElementById('admin-btn-text');
            if (window.isAdmin) {
                if(adminBtnText) adminBtnText.textContent = "Admin Aktiv";
            } else {
                if(adminBtnText) adminBtnText.textContent = "Admin";
            }
        }

        window.deleteItem = async function(collectionName, id) {
            if (!window.isAdmin) {
                showToast("Nur Admins dürfen Einträge löschen!", "error");
                return;
            }
            
            window.appData[collectionName] = window.appData[collectionName].filter(item => item.id !== id);
            renderApp();
            showToast("Eintrag erfolgreich gelöscht.");

            if (db) {
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', collectionName, id));
                } catch(e) {
                    console.warn("Cloud delete note:", e);
                }
            }
        }

        window.renderApp = function() {
            const container = document.getElementById('tab-content');
            if (!container) return;

            switch(window.currentTab) {
                case 'checkin': container.innerHTML = renderCheckinView(); break;
                case 'hinwand': container.innerHTML = renderHinwandView(); break;
                case 'pinwand': container.innerHTML = renderPinwandView(); break;
                case 'schwarzesbrett': container.innerHTML = renderSchwarzesBrettView(); break;
                case 'chat':
                    container.innerHTML = renderChatView();
                    setTimeout(() => {
                        const box = document.getElementById('chat-messages-box');
                        if(box) box.scrollTop = box.scrollHeight;
                    }, 50);
                    break;
                case 'kalender': container.innerHTML = renderKalenderView(); break;
                case 'pushsettings': container.innerHTML = renderPushSettingsView(); break;
                default: container.innerHTML = renderCheckinView();
            }
        }

        function renderCheckinView() {
            const allCheckins = window.appData.checkins || [];
            const twentyFourHoursAgo = Date.now() - (24 * 60 * 60 * 1000);
            const activeList = allCheckins.filter(item => item.timestamp >= twentyFourHoursAgo);
            const existingUserCheckin = allCheckins.find(item => item.nickname.toLowerCase() === window.userNickname.toLowerCase());
            const stats = window.getUsageStats();

            return `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="space-y-6">
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                            <h2 class="text-lg font-bold text-slate-800 mb-2"><i class="fa-solid fa-clipboard-check text-emerald-600 mr-2"></i>Check In & Status</h2>
                            <p class="text-xs text-slate-500 mb-6">Sie sind dauerhaft eingeloggt. Aktualisieren Sie hier ganz einfach Ihren Status oder Ihren Aufenthaltsort.</p>
                            
                            <form onsubmit="submitCheckin(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 mb-1">Ihr Name / Nickname (Pflichtfeld)</label>
                                    ${window.userNickname ? `
                                        <div class="w-full text-sm p-3 rounded-xl border border-slate-200 bg-slate-100 text-slate-700 font-bold flex items-center justify-between">
                                            <span>${escapeHtml(window.userNickname)}</span>
                                            <span class="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-medium">Dauerhaft aktiv</span>
                                        </div>
                                    ` : `
                                        <input type="text" id="checkin-nickname" placeholder="z.B. Anna Müller..." required class="w-full text-sm p-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-slate-50">
                                    `}
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 mb-1">Status / Aktivität (optional)</label>
                                    <input type="text" id="checkin-status" value="${existingUserCheckin ? escapeHtml(existingUserCheckin.status || '') : ''}" placeholder="z.B. Im Garten..." class="w-full text-sm p-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-slate-50">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 mb-1">Ort im Dorf (optional)</label>
                                    <input type="text" id="checkin-location" value="${existingUserCheckin ? escapeHtml(existingUserCheckin.location || '') : ''}" placeholder="z.B. Dorfplatz..." class="w-full text-sm p-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-slate-50">
                                </div>
                                <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-semibold transition shadow-sm cursor-pointer">
                                    <i class="fa-solid fa-arrows-rotate mr-2"></i>Status Aktualisieren
                                </button>
                            </form>
                        </div>

                        ${window.isAdmin ? `
                            <div class="bg-slate-900 text-white p-6 rounded-2xl shadow-md border border-slate-800">
                                <h3 class="text-sm font-bold text-emerald-400 mb-3 flex items-center"><i class="fa-solid fa-chart-line mr-2"></i>Admin: App-Nutzungszähler</h3>
                                <div class="grid grid-cols-3 gap-3 text-center">
                                    <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700">
                                        <span class="block text-xl font-extrabold text-white">${stats.day}</span>
                                        <span class="text-[10px] text-slate-400 uppercase tracking-wider">Heute</span>
                                    </div>
                                    <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700">
                                        <span class="block text-xl font-extrabold text-white">${stats.week}</span>
                                        <span class="text-[10px] text-slate-400 uppercase tracking-wider">Diese Woche</span>
                                    </div>
                                    <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700">
                                        <span class="block text-xl font-extrabold text-white">${stats.month}</span>
                                        <span class="text-[10px] text-slate-400 uppercase tracking-wider">Diesen Monat</span>
                                    </div>
                                </div>
                            </div>
                        ` : ''}
                    </div>

                    <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h2 class="text-lg font-bold text-slate-800 mb-4"><i class="fa-solid fa-users text-emerald-600 mr-2"></i>Aktive Bewohner Online (${activeList.length})</h2>
                        <div class="space-y-3 max-h-[500px] overflow-y-auto pr-2">
                            ${activeList.length === 0 ? '<p class="text-slate-400 text-sm italic py-8 text-center">Aktuell ist niemand online eingecheckt.</p>' :
                                activeList.map(item => `
                                    <div class="p-4 rounded-xl border border-slate-100 bg-slate-50 flex justify-between items-center">
                                        <div>
                                            <div class="flex items-center space-x-2">
                                                <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                                                <span class="font-bold text-sm text-slate-800">${escapeHtml(item.nickname)}</span>
                                                ${item.status ? `<span class="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-medium">${escapeHtml(item.status)}</span>` : ''}
                                            </div>
                                            <p class="text-xs text-slate-500 mt-1"><i class="fa-solid fa-location-dot mr-1 text-slate-400"></i>${escapeHtml(item.location || 'Kein Ort angegeben')} &bull; ${new Date(item.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</p>
                                        </div>
                                        ${window.isAdmin ? `<button type="button" onclick="deleteItem('checkins', '${item.id}')" class="text-red-500 hover:text-red-700 text-xs px-2.5 py-1 rounded-lg bg-red-50 font-medium cursor-pointer">Löschen</button>` : ''}
                                    </div>
                                `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        window.submitCheckin = async function(e) {
            e.preventDefault();
            const nicknameInput = window.userNickname || document.getElementById('checkin-nickname').value.trim();
            const status = document.getElementById('checkin-status').value.trim() || 'Online';
            const location = document.getElementById('checkin-location').value.trim();
            if (!nicknameInput) return;

            const allCheckins = window.appData.checkins || [];
            const nameTaken = allCheckins.some(item => 
                item.nickname.toLowerCase() === nicknameInput.toLowerCase() && 
                window.userNickname.toLowerCase() !== nicknameInput.toLowerCase()
            );

            if (nameTaken) {
                showToast("Dieser Name ist bereits vergeben. Bitte wählen Sie einen anderen Namen.", "error");
                return;
            }

            window.userNickname = nicknameInput;
            window.isCheckedIn = true;

                event.target.value = '';
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64 = e.target.result;
                document.getElementById('hw-pdf-base64').value = base64;
                document.getElementById('hw-pdf-name').value = file.name;
                const label = document.getElementById('pdf-selected-label');
                document.getElementById('pdf-file-name-text').textContent = file.name;
                label.classList.remove('hidden');

            reader.readAsDataURL(file);

                                <label class="block text-xs font-semibold text-slate-700 mb-1">Beschreibung / Details</label>
                                <textarea id="cal-desc" rows="3" placeholder="Beschreibung..." class="w-full text-sm p-3 rounded-xl border border-slate-300 bg-slate-50"></textarea>
                            </div>
                            <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-semibold transition shadow-sm cursor-pointer">
                                <i class="fa-solid fa-calendar-check mr-2"></i>Termin Speichern
                            </button>
                        </form>
                    </div>
                    <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h2 class="text-lg font-bold text-slate-800 mb-4"><i class="fa-solid fa-calendar-days text-emerald-600 mr-2"></i>Anstehende Dorf-Termine (${list.length})</h2>
                        <div class="space-y-4 max-h-[550px] overflow-y-auto pr-2">
                            ${list.length === 0 ? '<p class="text-slate-400 text-sm italic py-8 text-center">Keine Termine eingetragen.</p>' :
                                list.map(item => `
                                    <div class="p-4 rounded-xl border border-slate-200 bg-slate-50 flex flex-col md:flex-row justify-between items-start gap-4">
                                        <div class="space-y-1 flex-1">
                                            <div class="flex items-center space-x-2">
                                                <span class="text-xs bg-emerald-100 text-emerald-800 font-bold px-2.5 py-0.5 rounded-full"><i class="fa-solid fa-calendar mr-1"></i>${escapeHtml(item.date)} ${item.time ? 'um ' + escapeHtml(item.time) : ''}</span>
                                            </div>
                                            <h3 class="font-bold text-sm text-slate-900">${escapeHtml(item.title)}</h3>
                                            ${item.location ? `<p class="text-xs text-slate-600"><i class="fa-solid fa-location-dot mr-1 text-slate-400"></i>${escapeHtml(item.location)}</p>` : ''}
                                            ${item.description ? `<p class="text-xs text-slate-500 mt-1">${escapeHtml(item.description)}</p>` : ''}
                                            <p class="text-[10px] text-slate-400 pt-1">Eingetragen von: ${escapeHtml(item.nickname)}</p>
                                        </div>
                                        <div class="flex flex-col sm:flex-row gap-2 w-full md:w-auto shrink-0">
                                            <button type="button" onclick="downloadIcal('${item.id}')" class="px-3.5 py-2.5 bg-slate-900 hover:bg-slate-800 text-white text-xs font-medium rounded-xl transition flex items-center justify-center space-x-1.5 cursor-pointer">
                                                <i class="fa-solid fa-calendar-plus"></i><span>Termin zum persönlichen Kalender hinzufügen</span>
                                            </button>
                                            ${window.isAdmin ? `<button type="button" onclick="deleteItem('kalender', '${item.id}')" class="px-3 py-2.5 bg-red-50 hover:bg-red-100 text-red-600 text-xs font-medium rounded-xl transition cursor-pointer">Löschen</button>` : ''}
                                        </div>
                                    </div>
                                `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        window.submitKalender = async function(e) {
            e.preventDefault();
            const nickname = window.userNickname || 'Anonym';
            const titleElement = document.getElementById('cal-title');
            const dateElement = document.getElementById('cal-date');
            const timeElement = document.getElementById('cal-time');
            const locationElement = document.getElementById('cal-location');
            const descElement = document.getElementById('cal-desc');

            if (!titleElement || !dateElement) return;

            const title = titleElement.value.trim();
            const date = dateElement.value;
            const time = timeElement ? timeElement.value : '';
            const location = locationElement ? locationElement.value.trim() : '';
            const description = descElement ? descElement.value.trim() : '';

            if (!title || !date) return;

            const newItem = { id: 'kal_' + Date.now(), title, date, time, location, description, nickname, timestamp: Date.now() };
            if (!window.appData.kalender) window.appData.kalender = [];
            window.appData.kalender.push(newItem);
            renderApp();
            showToast("Termin erfolgreich eingetragen!");

            if (db) {
                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'kalender'), { title, date, time, location, description, nickname, timestamp: newItem.timestamp });
                } catch(e) { console.warn("Kalender cloud note:", e); }
            }
        }

        function getCalendarItem(id) {
            return (window.appData.kalender || []).find(item => item.id === id);
        }

        window.openTimePicker = function() {
            let modal = document.getElementById('custom-time-modal');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'custom-time-modal';
                modal.className = 'fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-start justify-center pt-20 p-4';
                modal.innerHTML = `
                    <div class="bg-white rounded-2xl shadow-2xl max-w-xs w-full p-6 border border-slate-100 animate-in fade-in zoom-in duration-200">
                        <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
                            <h3 class="text-sm font-bold text-slate-800"><i class="fa-solid fa-clock text-emerald-600 mr-2"></i>Uhrzeit auswählen</h3>
                            <button type="button" onclick="closeTimePicker()" class="text-slate-400 hover:text-slate-600 text-sm font-bold cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div class="grid grid-cols-2 gap-3 mb-6">
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-600 mb-1">Stunde</label>
                                <select id="picker-hour" class="w-full text-sm p-3 rounded-xl border border-slate-300 bg-slate-50 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                                    ${Array.from({length: 24}, (_, i) => `<option value="${String(i).padStart(2,'0')}">${String(i).padStart(2,'0')} Uhr</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-600 mb-1">Minute</label>
                                <select id="picker-minute" class="w-full text-sm p-3 rounded-xl border border-slate-300 bg-slate-50 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                                    <option value="00">00 Min</option>
                                    <option value="15">15 Min</option>
                                    <option value="30" selected>30 Min</option>
                                    <option value="45">45 Min</option>
                                </select>
                            </div>
                        </div>
                        <div class="flex space-x-2">
                            <button type="button" onclick="closeTimePicker()" class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition cursor-pointer">Abbrechen</button>
                            <button type="button" onclick="applyCustomTime()" class="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-xl transition shadow-sm cursor-pointer">Übernehmen</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);
            } else {
                modal.classList.remove('hidden');
            }
        }

        window.closeTimePicker = function() {
            const modal = document.getElementById('custom-time-modal');
            if (modal) modal.classList.add('hidden');
        }

        window.applyCustomTime = function() {
            const h = document.getElementById('picker-hour').value;
            const m = document.getElementById('picker-minute').value;
            const timeStr = `${h}:${m}`;
            document.getElementById('cal-time').value = timeStr;
            document.getElementById('cal-time-display').value = `${timeStr} Uhr`;
            closeTimePicker();
            showToast(`Uhrzeit ${timeStr} Uhr übernommen!`);
        }

        window.downloadIcal = function(id) {
            const item = getCalendarItem(id);
            if (!item) return;

            const datePart = item.date.replace(/-/g, '');
            const timePart = item.time ? item.time.replace(/:/g, '') + '00' : '120000';
            const startStr = `${datePart}T${timePart}`;
            
            let endStr = startStr;
            if (item.time) {
                const [hours, minutes] = item.time.split(':');
                const endHours = String(Number(hours) + 1).padStart(2, '0');
                endStr = `${datePart}T${endHours}${minutes}00`;
            } else {
                endStr = `${datePart}T130000`;
            }

            const icsContent = [
                "BEGIN:VCALENDAR",
                "VERSION:2.0",
                "PRODID:-//Dorf-App//Gemeinschaftskalender//DE",
                "BEGIN:VEVENT",
                `UID:dorfapp-${item.id}@local`,
                `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').split('.')[0]}Z`,
                `DTSTART:${startStr}`,
                `DTEND:${endStr}`,
                `SUMMARY:${item.title}`,
                `DESCRIPTION:${item.description || ''} (Eingetragen von ${item.nickname || 'Unbekannt'})`,
                `LOCATION:${item.location || ''}`,
                "END:VEVENT",
                "END:VCALENDAR"
            ].join("\r\n");

            const encodedUri = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(icsContent);
            const link = document.createElement('a');
            link.setAttribute('href', encodedUri);
            const fileName = `${item.title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.ics`;
            link.setAttribute('download', fileName);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showToast(`Termin zum persönlichen Kalender hinzugefügt (${fileName})!`);
        };

        function renderPushSettingsView() {
            return `
                <div class="max-w-xl mx-auto bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <h2 class="text-lg font-bold text-slate-800 mb-2"><i class="fa-solid fa-bell text-emerald-600 mr-2"></i>Push-Benachrichtigungen verwalten</h2>
                    <p class="text-xs text-slate-500 mb-6">Wählen Sie aus, für welche Bereiche der Dorf-App Sie Benachrichtigungen erhalten möchten:</p>
                    
                    <div class="space-y-4 text-sm">
                        <label class="flex items-center justify-between p-3 rounded-xl border border-slate-100 bg-slate-50 cursor-pointer hover:bg-slate-100 transition">
                            <span class="font-medium text-slate-700 flex items-center"><i class="fa-solid fa-clipboard-check text-emerald-600 mr-2"></i>Check In Aktivitäten</span>
                            <input type="checkbox" id="notif-checkin" ${window.notificationSettings.checkin ? 'checked' : ''} onchange="saveNotificationSettings()" class="rounded text-emerald-600 focus:ring-emerald-500 w-5 h-5 cursor-pointer">
                        </label>
                        <label class="flex items-center justify-between p-3 rounded-xl border border-slate-100 bg-slate-50 cursor-pointer hover:bg-slate-100 transition">
                            <span class="font-medium text-slate-700 flex items-center"><i class="fa-solid fa-bullhorn text-amber-600 mr-2"></i>Offizielle Bekanntmachungen</span>
                            <input type="checkbox" id="notif-hinwand" ${window.notificationSettings.hinwand ? 'checked' : ''} onchange="saveNotificationSettings()" class="rounded text-emerald-600 focus:ring-emerald-500 w-5 h-5 cursor-pointer">
                        </label>
                        <label class="flex items-center justify-between p-3 rounded-xl border border-slate-100 bg-slate-50 cursor-pointer hover:bg-slate-100 transition">
                            <span class="flex items-center font-medium text-slate-700"><i class="fa-solid fa-store text-emerald-600 mr-2"></i>Marktplatz Inserate</span>
                            <input type="checkbox" id="notif-pinwand" ${window.notificationSettings.pinwand ? 'checked' : ''} onchange="saveNotificationSettings()" class="rounded text-emerald-600 focus:ring-emerald-500 w-5 h-5 cursor-pointer">
                        </label>
                        <label class="flex items-center justify-between p-3 rounded-xl border border-slate-100 bg-slate-50 cursor-pointer hover:bg-slate-100 transition">
                            <span class="font-medium text-slate-700 flex items-center"><i class="fa-solid fa-note-sticky text-emerald-600 mr-2"></i>Schwarzes Brett Notizen</span>
                            <input type="checkbox" id="notif-schwarzesbrett" ${window.notificationSettings.schwarzesbrett ? 'checked' : ''} onchange="saveNotificationSettings()" class="rounded text-emerald-600 focus:ring-emerald-500 w-5 h-5 cursor-pointer">
                        </label>
                        <label class="flex items-center justify-between p-3 rounded-xl border border-slate-100 bg-slate-50 cursor-pointer hover:bg-slate-100 transition">
                            <span class="flex items-center font-medium text-slate-700"><i class="fa-solid fa-comments text-emerald-600 mr-2"></i>Dorf-Chat Nachrichten</span>
                            <input type="checkbox" id="notif-chat" ${window.notificationSettings.chat ? 'checked' : ''} onchange="saveNotificationSettings()" class="rounded text-emerald-600 focus:ring-emerald-500 w-5 h-5 cursor-pointer">
                        </label>
                        <label class="flex items-center justify-between p-3 rounded-xl border border-slate-100 bg-slate-50 cursor-pointer hover:bg-slate-100 transition">
                            <span class="font-medium text-slate-700 flex items-center"><i class="fa-solid fa-calendar-days text-emerald-600 mr-2"></i>Terminkalender Einträge</span>
                            <input type="checkbox" id="notif-kalender" ${window.notificationSettings.kalender ? 'checked' : ''} onchange="saveNotificationSettings()" class="rounded text-emerald-600 focus:ring-emerald-500 w-5 h-5 cursor-pointer">
                        </label>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
