```html
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dorf-App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <!-- Toast Benachrichtigung -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- Admin Passwort Modal -->
    <div id="admin-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 relative">
            <h3 class="text-lg font-bold text-slate-800 mb-2"><i class="fa-solid fa-lock text-emerald-600 mr-2"></i>Admin-Bereich entsperren</h3>
            <p class="text-sm text-slate-500 mb-4">Bitte geben Sie das Admin-Passwort ein, um Zugriff auf die Verwaltung zu erhalten.</p>
            <input type="password" id="admin-password-input" placeholder="Passwort..." class="w-full text-sm p-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none mb-4">
            <div class="flex justify-end space-x-2">
                <button onclick="closeAdminModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium rounded-xl transition">Abbrechen</button>
                <button onclick="verifyAdminPassword()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium rounded-xl transition">Anmelden</button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-emerald-600 text-white p-2.5 rounded-2xl shadow-md">
                    <i class="fa-solid fa-house-chimney text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900 tracking-tight">Dorf-App <span class="text-xs bg-emerald-100 text-emerald-800 px-2.5 py-0.5 rounded-full font-semibold ml-2">Gemeinschaft</span></h1>
                    <p class="text-xs text-slate-500">Gemeinsam vernetzt im Dorf</p>
                </div>
            </div>

            <!-- Nickname & Admin Status -->
            <div class="flex items-center flex-wrap gap-2 justify-end">
                <!-- Detaillierter Firebase Status Indikator -->
                <div id="firebase-status-badge" class="flex items-center bg-amber-50 border border-amber-200 px-3 py-1.5 rounded-xl text-xs font-medium text-amber-800 transition-all shadow-sm" title="Firebase Status">
                    <span class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse mr-2" id="firebase-dot"></span>
                    <span id="firebase-status-text">Verbinde mit Firebase...</span>
                </div>

                <div id="nickname-display-container" class="hidden sm:flex items-center bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-xl">
                    <span class="text-xs text-slate-400 mr-2"><i class="fa-solid fa-user mr-1"></i>Nickname:</span>
                    <span id="current-nickname-text" class="text-xs font-bold text-slate-700 mr-2">Nicht festgelegt</span>
                    <button onclick="openNicknameModal()" class="text-emerald-600 hover:text-emerald-700 text-xs font-semibold underline">Ändern</button>
                </div>
                <button id="admin-btn" onclick="handleAdminClick()" class="flex items-center space-x-1.5 px-3.5 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-medium transition shadow-sm">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span id="admin-btn-text">Admin</span>
                </button>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="bg-slate-50 border-t border-slate-200">
            <div class="max-w-7xl mx-auto px-4 flex overflow-x-auto space-x-2 py-2 scrollbar-none">
                <button onclick="switchTab('checkin')" class="tab-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center space-x-2 bg-emerald-600 text-white shadow-sm" data-tab="checkin">
                    <i class="fa-solid fa-clipboard-check"></i><span>Checkprogramm</span>
                </button>
                <button onclick="switchTab('pinwand')" class="tab-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center space-x-2 bg-white text-slate-600 hover:bg-slate-200/60" data-tab="pinwand">
                    <i class="fa-solid fa-signs-post"></i><span>Pin-wand</span>
                </button>
                <button onclick="switchTab('schwarzesbrett')" class="tab-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center space-x-2 bg-white text-slate-600 hover:bg-slate-200/60" data-tab="schwarzesbrett">
                    <i class="fa-solid fa-note-sticky"></i><span>Schwarzes Brett</span>
                </button>
                <button onclick="switchTab('hinwand')" class="tab-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center space-x-2 bg-white text-slate-600 hover:bg-slate-200/60" data-tab="hinwand">
                    <i class="fa-solid fa-bullhorn text-amber-600"></i><span>Hinwand</span>
                </button>
                <button onclick="switchTab('chat')" class="tab-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center space-x-2 bg-white text-slate-600 hover:bg-slate-200/60" data-tab="chat">
                    <i class="fa-solid fa-comments"></i><span>Dorf-Chat</span>
                </button>
                <button onclick="switchTab('kalender')" class="tab-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center space-x-2 bg-white text-slate-600 hover:bg-slate-200/60" data-tab="kalender">
                    <i class="fa-solid fa-calendar-days"></i><span>Terminkalender</span>
                </button>
                <button id="admin-tab-btn" onclick="switchTab('admin')" class="tab-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center space-x-2 bg-white text-slate-600 hover:bg-slate-200/60 hidden" data-tab="admin">
                    <i class="fa-solid fa-gears text-amber-500"></i><span>Adminbereich</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
        <div id="tab-content" class="w-full">
            <!-- Wird dynamisch gerendert -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400">
        Dorf-App &bull; Alle Daten und Aktivitäten im Überblick
    </footer>

    <!-- Firebase SDKs & App Logik -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, deleteDoc, onSnapshot, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Ihr offizielles Firebase Konfigurationsobjekt
        const firebaseConfig = {
            apiKey: "AIzaSyBW3EyegmGhtzzCmY3CxwP8UR8wJWPsCs4",
            authDomain: "dorfapp-2c48f.firebaseapp.com",
            projectId: "dorfapp-2c48f",
            storageBucket: "dorfapp-2c48f.firebasestorage.app",
            messagingSenderId: "447527926701",
            appId: "1:447527926701:web:180ad7e2312bd96a4d7f24"
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'dorf-app-default';

        let app, db, auth, currentUser = null;
        window.appData = {
            checkins: [],
            pinwand: [],
            schwarzesbrett: [],
            hinwand: [],
            chat: [],
            visitors: 0
        };

        window.currentTab = 'checkin';
        window.userNickname = localStorage.getItem('dorf_nickname') || '';
        window.isAdmin = localStorage.getItem('dorf_is_admin') === 'true';

        // Präzise Status-Anzeige für Verbindung vs. Sicherheitsproblem / Zugriffsrechte
        function updateFirebaseStatus(status, message) {
            const badge = document.getElementById('firebase-status-badge');
            const dot = document.getElementById('firebase-dot');
            const text = document.getElementById('firebase-status-text');
            if(!badge || !dot || !text) return;

            badge.classList.remove('hidden');
            if (status === 'connected') {
                badge.className = "flex items-center bg-emerald-50 border border-emerald-200 px-3 py-1.5 rounded-xl text-xs font-medium text-emerald-800 transition-all shadow-sm";
                dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 mr-2";
                text.textContent = message || "Online & Verbunden";
            } else if (status === 'security_error') {
                // Konkreter Hinweis auf Sicherheitsproblem / Firestore Security Rules
                badge.className = "flex items-center bg-red-50 border border-red-200 px-3 py-1.5 rounded-xl text-xs font-medium text-red-800 transition-all shadow-sm";
                dot.className = "w-2.5 h-2.5 rounded-full bg-red-600 mr-2";
                text.textContent = message || "Sicherheitsproblem: Keine Zugriffsrechte (Firestore Rules prüfen)";
            } else if (status === 'error') {
                badge.className = "flex items-center bg-amber-50 border border-amber-200 px-3 py-1.5 rounded-xl text-xs font-medium text-amber-800 transition-all shadow-sm";
                dot.className = "w-2.5 h-2.5 rounded-full bg-amber-500 mr-2";
                text.textContent = message || "Keine Verbindung zu Firebase";
            } else {
                badge.className = "flex items-center bg-blue-50 border border-blue-200 px-3 py-1.5 rounded-xl text-xs font-medium text-blue-800 transition-all shadow-sm";
                dot.className = "w-2.5 h-2.5 rounded-full bg-blue-500 animate-pulse mr-2";
                text.textContent = message || "Verbinde mit Firebase...";
            }
        }

        // Toast Helper
        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if(!container) return;
            const toast = document.createElement('div');
            toast.className = `p-4 rounded-xl shadow-lg text-sm font-medium text-white transition transform translate-y-2 opacity-0 pointer-events-auto flex items-center space-x-2 ${type === 'error' ? 'bg-red-600' : 'bg-emerald-600'}`;
            toast.innerHTML = `<i class="fa-solid ${type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check'}"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 50);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        // Escape HTML
        window.escapeHtml = function(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Initialize Firebase
        async function initFirebase() {
            try {
                updateFirebaseStatus('connecting', 'Initialisiere Firebase...');
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                currentUser = auth.currentUser;
                
                // Besucherzähler erhöhen
                await registerVisitor();

                // Live Listeners starten
                setupListeners();
            } catch (e) {
                console.error("Firebase Init Fehler:", e);
                // Prüfen ob es ein Authentifizierungs- oder Netzwerkfehler ist
                updateFirebaseStatus('error', 'Verbindungsfehler zu Firebase');
            }
        }

        async function registerVisitor() {
            if (!db) return;
            try {
                const visitorDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'stats', 'visitors');
                const snap = await getDoc(visitorDocRef);
                let count = 1;
                if (snap.exists()) {
                    count = (snap.data().count || 0) + 1;
                }
                await setDoc(visitorDocRef, { count: count }, { merge: true });
                window.appData.visitors = count;
                renderApp();
            } catch(e) {
                console.error("Besucherzähler Zugriffsfehler:", e);
                // Spezifische Erkennung für Sicherheitsprobleme / Firestore-Regelverstöße (permission-denied)
                if (e.code === 'permission-denied' || (e.message && e.message.includes('permission'))) {
                    updateFirebaseStatus('security_error', 'Sicherheitsproblem: Keine Schreibrechte (Firestore Rules verweigert)');
                } else {
                    updateFirebaseStatus('error', 'Fehler beim Laden der Besucherdaten');
                }
            }
        }

        function setupListeners() {
            const collections = ['checkins', 'pinwand', 'schwarzesbrett', 'hinwand', 'chat'];
            collections.forEach(colName => {
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', colName);
                onSnapshot(colRef, (snapshot) => {
                    const items = [];
                    snapshot.forEach(d => {
                        items.push({ id: d.id, ...d.data() });
                    });
                    window.appData[colName] = items;
                    updateFirebaseStatus('connected', 'Verbunden (Live synchronisiert)');
                    renderApp();
                }, (error) => {
                    console.error(`Fehler bei ${colName}:`, error);
                    if (error.code === 'permission-denied' || (error.message && error.message.includes('permission'))) {
                        updateFirebaseStatus('security_error', 'Sicherheitsproblem: Zugriffsrechte verweigert');
                    } else {
                        updateFirebaseStatus('error', 'Verbindung zu Firestore unterbrochen');
                    }
                });
            });

            // Besucherzähler live beobachten
            const visitorDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'stats', 'visitors');
            onSnapshot(visitorDocRef, (snap) => {
                if(snap.exists()) {
                    window.appData.visitors = snap.data().count || 0;
                    renderApp();
                }
            }, (error) => {
                console.error("Besucherzähler Listener Fehler:", error);
            });
        }

        // Nickname Modal Management
        window.openNicknameModal = function() {
            const name = prompt("Bitte gib deinen Dorf-Nickname ein:", window.userNickname);
            if (name !== null) {
                const trimmed = name.trim();
                if (trimmed) {
                    window.userNickname = trimmed;
                    localStorage.setItem('dorf_nickname', trimmed);
                    document.getElementById('current-nickname-text').textContent = trimmed;
                    showToast("Nickname gespeichert!");
                    renderApp();
                } else {
                    showToast("Der Nickname darf nicht leer sein.", "error");
                }
            }
        }

        // Check if Nickname exists on load
        window.addEventListener('DOMContentLoaded', () => {
            if (!window.userNickname) {
                setTimeout(() => {
                    openNicknameModal();
                }, 500);
            } else {
                document.getElementById('current-nickname-text').textContent = window.userNickname;
            }
            updateAdminUI();
            renderApp();
            initFirebase();
        });

        // Tab Navigation
        window.switchTab = function(tabName) {
            if (tabName === 'admin' && !window.isAdmin) {
                document.getElementById('admin-modal').classList.remove('hidden');
                return;
            }
            window.currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.dataset.tab === tabName) {
                    btn.className = "tab-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center space-x-2 bg-emerald-600 text-white shadow-sm";
                } else {
                    btn.className = "tab-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center space-x-2 bg-white text-slate-600 hover:bg-slate-200/60";
                }
            });
            renderApp();
        }

        // Admin Access Handling
        window.handleAdminClick = function() {
            if (window.isAdmin) {
                if (confirm("Möchtest du den Admin-Modus verlassen?")) {
                    window.isAdmin = false;
                    localStorage.setItem('dorf_is_admin', 'false');
                    updateAdminUI();
                    if(window.currentTab === 'admin') switchTab('checkin');
                    showToast("Admin-Modus beendet");
                }
            } else {
                document.getElementById('admin-modal').classList.remove('hidden');
            }
        }

        window.closeAdminModal = function() {
            document.getElementById('admin-modal').classList.add('hidden');
            document.getElementById('admin-password-input').value = '';
        }

        window.verifyAdminPassword = function() {
            const pwd = document.getElementById('admin-password-input').value;
            if (pwd === "dorf2026" || pwd === "admin") {
                window.isAdmin = true;
                localStorage.setItem('dorf_is_admin', 'true');
                closeAdminModal();
                updateAdminUI();
                showToast("Admin-Bereich erfolgreich entsperrt!");
                switchTab('admin');
            } else {
                showToast("Falsches Passwort!", "error");
            }
        }

        window.updateAdminUI = function() {
            const adminTabBtn = document.getElementById('admin-tab-btn');
            const adminBtnText = document.getElementById('admin-btn-text');
            if (window.isAdmin) {
                adminTabBtn.classList.remove('hidden');
                adminBtnText.textContent = "Admin Aktiv";
            } else {
                adminTabBtn.classList.add('hidden');
                adminBtnText.textContent = "Admin";
            }
        }

        // Universal Delete Function for Admin
        window.deleteItem = async function(collectionName, id) {
            if (!window.isAdmin) {
                showToast("Nur Admins dürfen Einträge löschen!", "error");
                return;
            }
            if (!confirm("Möchtest du diesen Eintrag wirklich löschen?")) return;
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', collectionName, id));
                showToast("Eintrag erfolgreich gelöscht.");
            } catch(e) {
                console.error("Löschfehler:", e);
                showToast("Sicherheitsproblem beim Löschen (Zugriffsrechte prüfen)", "error");
            }
        }

        // Render Application Main View
        window.renderApp = function() {
            const container = document.getElementById('tab-content');
            if (!container) return;

            switch(window.currentTab) {
                case 'checkin':
                    container.innerHTML = renderCheckinView();
                    break;
                case 'pinwand':
                    container.innerHTML = renderPinwandView();
                    break;
                case 'schwarzesbrett':
                    container.innerHTML = renderSchwarzesBrettView();
                    break;
                case 'hinwand':
                    container.innerHTML = renderHinwandView();
                    break;
                case 'chat':
                    container.innerHTML = renderChatView();
                    setTimeout(() => {
                        const box = document.getElementById('chat-messages-box');
                        if(box) box.scrollTop = box.scrollHeight;
                    }, 50);
                    break;
                case 'kalender':
                    container.innerHTML = renderKalenderView();
                    break;
                case 'admin':
                    container.innerHTML = renderAdminView();
                    break;
                default:
                    container.innerHTML = renderCheckinView();
            }
        }

        // 1. Checkprogramm View
        function renderCheckinView() {
            const list = window.appData.checkins || [];
            return `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h2 class="text-lg font-bold text-slate-800 mb-2"><i class="fa-solid fa-clipboard-check text-emerald-600 mr-2"></i>Dorf-Checkin</h2>
                        <p class="text-xs text-slate-500 mb-6">Trage dich ein, damit die Dorfgemeinschaft weiß, wer gerade anwesend oder aktiv ist.</p>
                        
                        <form onsubmit="submitCheckin(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Dein Status / Aktivität</label>
                                <input type="text" id="checkin-status" placeholder="z.B. Im Garten, Anwesend, Hilfe verfügbar..." required class="w-full text-sm p-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-slate-50">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">Ort / Bereich im Dorf</label>
                                <input type="text" id="checkin-location" placeholder="z.B. Dorfplatz, Hauptstraße..." class="w-full text-sm p-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-slate-50">
                            </div>
                            <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-semibold transition shadow-sm">
                                <i class="fa-solid fa-check mr-2"></i>Einchecken
                            </button>
                        </form>
                    </div>

                    <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h2 class="text-lg font-bold text-slate-800 mb-4"><i class="fa-solid fa-users text-emerald-600 mr-2"></i>Aktive Dorfbewohner (${list.length})</h2>
                        <div class="space-y-3 max-h-[500px] overflow-y-auto pr-2">
                            ${list.length === 0 ? '<p class="text-slate-400 text-sm italic py-8 text-center">Aktuell hat sich noch niemand eingecheckt.</p>' :
                                list.map(item => `
                                    <div class="p-4 rounded-xl border border-slate-100 bg-slate-50 flex justify-between items-center">
                                        <div>
                                            <div class="flex items-center space-x-2">
                                                <span class="font-bold text-sm text-slate-800">${escapeHtml(item.nickname)}</span>
                                                <span class="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-medium">${escapeHtml(item.status)}</span>
                                            </div>
                                            <p class="text-xs text-slate-500 mt-1"><i class="fa-solid fa-location-dot mr-1 text-slate-400"></i>${escapeHtml(item.location || 'Kein Ort angegeben')} &bull; <span class="text-[10px] text-slate-400">${new Date(item.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span></p>
                                        </div>
                                        ${window.isAdmin ? `<button onclick="deleteItem('checkins', '${item.id}')" class="text-red-500 hover:text-red-700 text-xs px-2.5 py-1 rounded-lg bg-red-50 font-medium">Löschen</button>` : ''}
                                    </div>
                                `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        window.submitCheckin = async function(e) {
            e.preventDefault();
            if (!window.userNickname) { openNicknameModal(); return; }
            const status = document.getElementById('checkin-status').value.trim();
            const location = document.getElementById('checkin-location').value.trim();
            if (!status) return;

            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'checkins'), {
                    nickname: window.userNickname,
                    status: status,
                    location: location,
                    timestamp: Date.now()
                });
                document.getElementById('checkin-status').value = '';
                document.getElementById('checkin-location').value = '';
                showToast("Erfolgreich eingecheckt!");
            } catch(e) {
                console.error(e);
                showToast("Sicherheitsproblem oder Schreibrechte verweigert", "error");
            }
        }

        // 2. Pin-wand (Suchen / Bieten / Verschenken) View
        function renderPinwandView() {
            const list = window.appData.pinwand || [];
