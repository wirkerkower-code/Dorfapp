<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DorfApp - Gemeinsam statt einsam</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel für JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div id="root">
        <div style="text-align:center; margin-top:20vh; font-family:sans-serif; color:#555;">
            <h2>DorfApp lädt...</h2>
            <p>Bitte einen Moment Geduld.</p>
        </div>
    </div>

    <!-- Firebase & App Logik -->
    <script type="text/babel">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, serverTimestamp, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Ihr Firebase Code
        const firebaseConfig = {
          apiKey: "AIzaSyBW3EyegmGhtzzCmY3CxwP8UR8wJWPsCs4",
          authDomain: "dorfapp-2c48f.firebaseapp.com",
          projectId: "dorfapp-2c48f",
          storageBucket: "dorfapp-2c48f.firebasestorage.app",
          messagingSenderId: "447527926701",
          appId: "1:447527926701:web:180ad7e2312bd96a4d7f24"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const userId = 'user_' + Math.random().toString(36).substring(2, 9);
        const userName = 'Nachbar ' + Math.floor(Math.random() * 900 + 100);

        function App() {
            const [activeTab, setActiveTab] = React.useState('chat');
            const [isAdmin, setIsAdmin] = React.useState(false);
            const [adminPassword, setAdminPassword] = React.useState('');
            const [onlineCount, setOnlineCount] = React.useState(1);

            const [chatMessages, setChatMessages] = React.useState([]);
            const [chatText, setChatText] = React.useState('');
            
            const [pinnwandItems, setPinnwandItems] = React.useState([]);
            const [pTitle, setPTitle] = React.useState('');
            const [pDesc, setPDesc] = React.useState('');
            const [pCategory, setPCategory] = React.useState('Biete');

            const [brettItems, setBrettItems] = React.useState([]);
            const [bTitle, setBTitle] = React.useState('');
            const [bDesc, setBDesc] = React.useState('');

            React.useEffect(() => {
                try {
                    const presenceRef = doc(db, 'presence', userId);
                    setDoc(presenceRef, { name: userName, lastSeen: serverTimestamp() }, { merge: true });
                    const interval = setInterval(() => {
                        setDoc(presenceRef, { lastSeen: serverTimestamp() }, { merge: true });
                    }, 30000);

                    const unsubscribePresence = onSnapshot(collection(db, 'presence'), (snapshot) => {
                        setOnlineCount(snapshot.size);
                    });

                    const unsubscribeChat = onSnapshot(collection(db, 'chat'), (snapshot) => {
                        const msgs = [];
                        snapshot.forEach(d => msgs.push({ id: d.id, ...d.data() }));
                        setChatMessages(msgs.sort((a,b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0)));
                    });

                    const unsubscribePin = onSnapshot(collection(db, 'pinnwand'), (snapshot) => {
                        const items = [];
                        snapshot.forEach(d => items.push({ id: d.id, ...d.data() }));
                        setPinnwandItems(items);
                    });

                    const unsubscribeBrett = onSnapshot(collection(db, 'schwarzesBrett'), (snapshot) => {
                        const items = [];
                        snapshot.forEach(d => items.push({ id: d.id, ...d.data() }));
                        setBrettItems(items);
                    });

                    return () => {
                        clearInterval(interval);
                        unsubscribePresence();
                        unsubscribeChat();
                        unsubscribePin();
                        unsubscribeBrett();
                    };
                } catch (e) {
                    console.error("Firebase Init Fehler:", e);
                }
            }, []);

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (adminPassword === 'admin123') {
                    setIsAdmin(true);
                    alert('Admin-Modus aktiviert!');
                } else {
                    alert('Falsches Passwort!');
                }
            };

            const handleDelete = async (collectionName, id) => {
                if (!isAdmin) return;
                if (confirm('Diesen Eintrag wirklich unwiderruflich löschen?')) {
                    try {
                        await deleteDoc(doc(db, collectionName, id));
                    } catch (err) {
                        alert('Fehler beim Löschen: ' + err.message);
                    }
                }
            };

            const sendChat = async (e) => {
                e.preventDefault();
                if (!chatText.trim()) return;
                await addDoc(collection(db, 'chat'), {
                    text: chatText,
                    sender: userName,
                    createdAt: serverTimestamp()
                });
                setChatText('');
            };

            const addPinnwand = async (e) => {
                e.preventDefault();
                if (!pTitle.trim() || !pDesc.trim()) return;
                await addDoc(collection(db, 'pinnwand'), {
                    title: pTitle,
                    description: pDesc,
                    category: pCategory,
                    sender: userName,
                    createdAt: serverTimestamp()
                });
                setPTitle('');
                setPDesc('');
            };

            const addBrett = async (e) => {
                e.preventDefault();
                if (!isAdmin) {
                    alert('Nur der Admin darf offizielle Beiträge am Schwarzen Brett erstellen.');
                    return;
                }
                if (!bTitle.trim() || !bDesc.trim()) return;
                await addDoc(collection(db, 'schwarzesBrett'), {
                    title: bTitle,
                    description: bDesc,
                    createdAt: serverTimestamp()
                });
                setBTitle('');
                setBDesc('');
            };

            return (
                <div className="max-w-3xl mx-auto pb-12">
                    <header className="bg-emerald-700 text-white p-4 shadow-md flex justify-between items-center">
                        <div>
                            <h1 className="text-xl font-bold">🏡 DorfApp</h1>
                            <p className="text-xs text-emerald-200">Gemeinsam statt einsam</p>
                        </div>
                        <div className="text-right text-xs bg-emerald-800 p-2 rounded-lg">
                            <span className="inline-block w-2 h-2 rounded-full bg-green-400 mr-1 animate-pulse"></span>
                            Anwesend: <b>{onlineCount}</b> Nutzer
                            {isAdmin && <span className="block text-yellow-300 font-bold mt-0.5">Admin aktiv</span>}
                        </div>
                    </header>

                    <nav className="flex bg-white shadow overflow-x-auto border-b">
                        <button onClick={() => setActiveTab('chat')} className={`flex-1 py-3 px-4 text-center font-medium text-sm whitespace-nowrap ${activeTab === 'chat' ? 'border-b-2 border-emerald-600 text-emerald-600 bg-emerald-50' : 'text-gray-600'}`}>💬 Live-Chat</button>
                        <button onClick={() => setActiveTab('pinnwand')} className={`flex-1 py-3 px-4 text-center font-medium text-sm whitespace-nowrap ${activeTab === 'pinnwand' ? 'border-b-2 border-emerald-600 text-emerald-600 bg-emerald-50' : 'text-gray-600'}`}>📌 Pinnwand</button>
                        <button onClick={() => setActiveTab('brett')} className={`flex-1 py-3 px-4 text-center font-medium text-sm whitespace-nowrap ${activeTab === 'brett' ? 'border-b-2 border-emerald-600 text-emerald-600 bg-emerald-50' : 'text-gray-600'}`}>🏛️ Schwarzes Brett</button>
                        <button onClick={() => setActiveTab('kalender')} className={`flex-1 py-3 px-4 text-center font-medium text-sm whitespace-nowrap ${activeTab === 'kalender' ? 'border-b-2 border-emerald-600 text-emerald-600 bg-emerald-50' : 'text-gray-600'}`}>📅 Termine</button>
                        <button onClick={() => setActiveTab('admin')} className={`flex-1 py-3 px-4 text-center font-medium text-sm whitespace-nowrap ${activeTab === 'admin' ? 'border-b-2 border-emerald-600 text-emerald-600 bg-emerald-50' : 'text-gray-600'}`}>⚙️ Admin</button>
                    </nav>

                    <main className="p-4">
                        {activeTab === 'chat' && (
                            <div className="bg-white rounded-xl shadow p-4 flex flex-col h-[70vh]">
                                <h2 className="font-bold text-gray-700 mb-2 border-b pb-2">Live-Dorfchat</h2>
                                <div className="flex-1 overflow-y-auto space-y-3 mb-4 pr-2">
                                    {chatMessages.length === 0 ? (
                                        <p className="text-gray-400 text-center mt-20">Noch keine Nachrichten im Chat. Schreib als Erster!</p>
                                    ) : (
                                        chatMessages.map(m => (
                                            <div key={m.id} className="bg-gray-50 p-3 rounded-lg border relative group">
                                                <div className="flex justify-between items-center text-xs text-gray-500 mb-1">
                                                    <span className="font-semibold text-emerald-700">{m.sender || 'Nachbar'}</span>
                                                    {isAdmin && (
                                                        <button onClick={() => handleDelete('chat', m.id)} className="text-red-500 hover:text-red-700 font-bold">Löschen</button>
                                                    )}
                                                </div>
                                                <p className="text-gray-800 text-sm">{m.text}</p>
                                            </div>
                                        ))
                                    )}
                                </div>
                                <form onSubmit={sendChat} className="flex gap-2">
                                    <input type="text" value={chatText} onChange={e => setChatText(e.target.value)} placeholder="Nachricht an das Dorf..." className="flex-1 border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-600" />
                                    <button type="submit" className="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-emerald-700">Senden</button>
                                </form>
                            </div>
                        )}

                        {activeTab === 'pinnwand' && (
                            <div className="space-y-6">
                                <div className="bg-white rounded-xl shadow p-4">
                                    <h2 className="font-bold text-gray-700 mb-3">Neuen Eintrag erstellen (Biete / Suche / Verschenke)</h2>
                                    <form onSubmit={addPinnwand} className="space-y-3">
                                        <div className="flex gap-2">
                                            <select value={pCategory} onChange={e => setPCategory(e.target.value)} className="border rounded-lg px-3 py-2 text-sm bg-white">
                                                <option value="Biete">Biete</option>
                                                <option value="Suche">Suche</option>
                                                <option value="Verschenke">Verschenke</option>
                                            </select>
                                            <input type="text" value={pTitle} onChange={e => setPTitle(e.target.value)} placeholder="Titel (z.B. Rasenmäher)" className="flex-1 border rounded-lg px-3 py-2 text-sm" />
                                        </div>
                                        <textarea value={pDesc} onChange={e => setPDesc(e.target.value)} placeholder="Beschreibung & Kontakt..." rows="2" className="w-full border rounded-lg px-3 py-2 text-sm"></textarea>
                                        <button type="submit" className="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-medium w-full">Anzeige veröffentlichen</button>
                                    </form>
                                </div>

                                <div className="grid gap-3">
                                    {pinnwandItems.length === 0 ? (
                                        <p className="text-gray-400 text-center py-10">Keine Pinnwand-Einträge vorhanden.</p>
                                    ) : (
                                        pinnwandItems.map(item => (
                                            <div key={item.id} className="bg-white rounded-xl shadow p-4 border-l-4 border-emerald-500 relative">
                                                <div className="flex justify-between items-start">
                                                    <div>
                                                        <span className={`text-xs px-2 py-0.5 rounded font-bold ${item.category === 'Verschenke' ? 'bg-purple-100 text-purple-700' : item.category === 'Biete' ? 'bg-blue-100 text-blue-700' : 'bg-amber-100 text-amber-700'}`}>{item.category}</span>
                                                        <h3 className="font-bold text-gray-800 mt-1">{item.title}</h3>
                                                    </div>
                                                    {isAdmin && (
                                                        <button onClick={() => handleDelete('pinnwand', item.id)} className="text-red-500 text-xs font-bold border border-red-200 px-2 py-1 rounded">Löschen</button>
                                                    )}
                                                </div>
                                                <p className="text-gray-600 text-sm mt-2">{item.description}</p>
                                                <p className="text-xs text-gray-400 mt-3">Eingestellt von: {item.sender || 'Nachbar'}</p>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}

                        {activeTab === 'brett' && (
                            <div className="space-y-6">
                                {isAdmin && (
                                    <div className="bg-amber-50 border border-amber-200 rounded-xl p-4">
                                        <h2 className="font-bold text-amber-800 mb-2">Offizielle Bekanntmachung erstellen (Admin)</h2>
                                        <form onSubmit={addBrett} className="space-y-3">
                                            <input type="text" value={bTitle} onChange={e => setBTitle(e.target.value)} placeholder="Titel der Bekanntmachung" className="w-full border rounded-lg px-3 py-2 text-sm bg-white" />
                                            <textarea value={bDesc} onChange={e => setBDesc(e.target.value)} placeholder="Offizieller Text..." rows="3" className="w-full border rounded-lg px-3 py-2 text-sm bg-white"></textarea>
                                            <button type="submit" className="bg-amber-600 text-white px-4 py-2 rounded-lg text-sm font-medium w-full">Offiziell veröffentlichen</button>
                                        </form>
                                    </div>
                                )}

                                <div className="grid gap-3">
                                    {brettItems.length === 0 ? (
                                        <p className="text-gray-400 text-center py-10">Keine offiziellen Bekanntmachungen vorhanden.</p>
                                    ) : (
                                        brettItems.map(item => (
                                            <div key={item.id} className="bg-white rounded-xl shadow p-4 border-l-4 border-red-600 relative">
                                                <div className="flex justify-between items-start">
                                                    <h3 className="font-bold text-gray-900 text-lg">🏛️ {item.title}</h3>
                                                    {isAdmin && (
                                                        <button onClick={() => handleDelete('schwarzesBrett', item.id)} className="text-red-500 text-xs font-bold border border-red-200 px-2 py-1 rounded">Löschen</button>
                                                    )}
                                                </div>
                                                <p className="text-gray-700 text-sm mt-2 whitespace-pre-wrap">{item.description}</p>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}

                        {activeTab === 'kalender' && (
                            <div className="bg-white rounded-xl shadow p-4">
                                <h2 className="font-bold text-gray-700 mb-3">Dorf-Terminkalender</h2>
                                <div className="w-full h-[500px] border rounded-lg overflow-hidden">
                                    <iframe 
                                        src="https://calendar.google.com/calendar/embed?src=de.german%23holiday%40group.v.calendar.google.com&ctz=Europe%2FBerlin" 
                                        style={{border: 0}} 
                                        width="100%" 
                                        height="100%" 
                                        frameBorder="0" 
                                        scrolling="no">
                                    </iframe>
                                </div>
                            </div>
                        )}

                        {activeTab === 'admin' && (
                            <div className="bg-white rounded-xl shadow p-6 max-w-md mx-auto">
                                <h2 className="font-bold text-gray-800 text-lg mb-4">Admin-Bereich</h2>
                                {!isAdmin ? (
                                    <form onSubmit={handleAdminLogin} className="space-y-4">
                                        <p className="text-sm text-gray-600">Admin-Passwort eingeben (Standard: admin123)</p>
                                        <input type="password" value={adminPassword} onChange={e => setAdminPassword(e.target.value)} placeholder="Passwort" className="w-full border rounded-lg px-3 py-2 text-sm" />
                                        <button type="submit" className="w-full bg-emerald-600 text-white py-2 rounded-lg text-sm font-medium">Anmelden</button>
                                    </form>
                                ) : (
                                    <div className="space-y-4">
                                        <div className="bg-emerald-50 border border-emerald-200 p-4 rounded-lg">
                                            <p className="text-emerald-800 font-semibold text-sm">✅ Admin aktiv</p>
                                            <p className="text-xs text-emerald-600 mt-1">Aktuell anwesende Nutzer: <b>{onlineCount}</b></p>
                                        </div>
                                        <button onClick={() => setIsAdmin(false)} className="w-full bg-red-100 text-red-700 py-2 rounded-lg text-sm font-medium">Admin-Modus beenden</button>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
